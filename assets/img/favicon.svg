<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="snGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02272F"/>
      <stop offset="100%" stop-color="#01181D"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F15A24"/>
      <stop offset="100%" stop-color="#FF7A45"/>
    </linearGradient>
  </defs>
  <!-- Background rounded hexagon -->
  <rect width="128" height="128" rx="28" fill="url(#snGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#F15A24" stroke-width="2.5" stroke-opacity="0.4"/>
  
  <!-- Neural / Quantum Lattice Nodes -->
  <circle cx="64" cy="30" r="5" fill="#F15A24"/>
  <circle cx="34" cy="80" r="4.5" fill="#F15A24" opacity="0.85"/>
  <circle cx="94" cy="80" r="4.5" fill="#F15A24" opacity="0.85"/>
  <line x1="64" y1="30" x2="34" y2="80" stroke="#F15A24" stroke-width="1.8" opacity="0.4"/>
  <line x1="64" y1="30" x2="94" y2="80" stroke="#F15A24" stroke-width="1.8" opacity="0.4"/>
  <line x1="34" y1="80" x2="94" y2="80" stroke="#F15A24" stroke-width="1.8" opacity="0.4"/>

  <!-- Monogram SN Typography -->
  <text x="64" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">SN</text>
  
  <!-- Accent Diamond -->
  <polygon points="64,95 68,100 64,105 60,100" fill="url(#orangeGrad)"/>
</svg>
