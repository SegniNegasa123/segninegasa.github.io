<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="grad_HWT" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#043A45" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#02272F" stop-opacity="1" />
    </radialGradient>
    <pattern id="grid_HWT" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06424E" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#grad_HWT)" rx="16" />
  <rect width="800" height="500" fill="url(#grid_HWT)" rx="16" />

  <!-- Outer Tech Border -->
  <rect x="14" y="14" width="772" height="472" rx="12" fill="none" stroke="#F15A24" stroke-width="2.5" stroke-opacity="0.85" />
  <rect x="22" y="22" width="756" height="456" rx="8" fill="none" stroke="#085160" stroke-width="1" stroke-dasharray="6 6" />

  <!-- Corner Brackets -->
  <path d="M 14 42 L 14 14 L 42 14" fill="none" stroke="#F15A24" stroke-width="4" stroke-linecap="round" />
  <path d="M 758 14 L 786 14 L 786 42" fill="none" stroke="#F15A24" stroke-width="4" stroke-linecap="round" />
  <path d="M 14 458 L 14 486 L 42 486" fill="none" stroke="#F15A24" stroke-width="4" stroke-linecap="round" />
  <path d="M 758 486 L 786 486 L 786 458" fill="none" stroke="#F15A24" stroke-width="4" stroke-linecap="round" />

  <!-- Top System Badge -->
  <g transform="translate(42, 44)">
    <rect width="320" height="28" rx="4" fill="#02272F" stroke="#F15A24" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4.5" fill="#F15A24" />
    <text x="28" y="18" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="10.5" font-weight="700" fill="#E6F1F3" letter-spacing="1.5">ENGINEERING // SENSORS & HARDWARE</text>
  </g>

  <!-- Dossier Code Box -->
  <g transform="translate(642, 44)">
    <rect width="116" height="28" rx="4" fill="#02272F" stroke="#0A6577" stroke-width="1" />
    <text x="58" y="18" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#8FAEB5" letter-spacing="1">DOSSIER</text>
  </g>

  <!-- Central Abbreviation -->
  <text x="400" y="240" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" letter-spacing="5">HWT</text>

  <!-- Accent Divider -->
  <line x1="220" y1="272" x2="580" y2="272" stroke="#F15A24" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="400" cy="272" r="4.5" fill="#FFFFFF" stroke="#F15A24" stroke-width="2" />

  <!-- Project Title -->
  <text x="400" y="322" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="2">HIWOT INTERFACE</text>

  <!-- Subtitle -->
  <text x="400" y="356" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-weight="600" font-size="13" fill="#F15A24" letter-spacing="2">sEMG SILENT SPEECH BIOTECH</text>

  <!-- Bottom Technical Footer -->
  <g transform="translate(42, 442)">
    <line x1="0" y1="0" x2="716" y2="0" stroke="#06424E" stroke-width="1" />
    <text x="0" y="20" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="10" fill="#62858D" letter-spacing="1.5">SEC: 02 // TECHNICAL PORTFOLIO</text>
    <text x="716" y="20" text-anchor="end" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="10" fill="#F15A24" letter-spacing="1.5">STATUS: VERIFIED</text>
